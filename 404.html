<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Stackly</title>
    <meta name="description" content="Oops! The page you're looking for doesn't exist. Navigate back to Stackly and continue your journey.">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --blue: #1769FF;
            --dark: #020617;
            --panel: #0f172a;
            --surface: #111827;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ── Stars Background ── */
        .stars-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .star {
            position: absolute;
            border-radius: 50%;
            background: white;
            animation: twinkle var(--d, 4s) ease-in-out infinite;
            opacity: 0;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.8); }
            50% { opacity: var(--o, 0.7); transform: scale(1); }
        }

        /* ── Glowing Orbs ── */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
        }
        .orb-1 { width: 500px; height: 500px; background: rgba(23, 105, 255, 0.15); top: -150px; left: -100px; }
        .orb-2 { width: 400px; height: 400px; background: rgba(139, 92, 246, 0.1); bottom: -100px; right: -100px; }

        /* ── Navbar ── */
        .navbar-404 {
            position: relative;
            z-index: 10;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .navbar-brand-404 {
            font-size: 1.4rem;
            font-weight: 800;
            color: white;
            text-decoration: none;
            letter-spacing: -0.5px;
        }
        .navbar-brand-404 i { color: var(--blue); }

        /* ── Main Content ── */
        .page-center {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            padding: 3rem 1rem;
        }

        /* ── 404 Giant Number ── */
        .giant-404 {
            font-size: clamp(120px, 20vw, 220px);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -10px;
            background: linear-gradient(135deg, #1769FF 0%, #60a5fa 40%, #a78bfa 80%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            user-select: none;
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        /* Glowing underline */
        .giant-404::after {
            content: '';
            display: block;
            width: 60%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #1769FF, #a78bfa, transparent);
            margin: 1rem auto 0;
            border-radius: 2px;
            animation: glow-line 2s ease-in-out infinite alternate;
        }
        @keyframes glow-line {
            from { box-shadow: 0 0 10px #1769FF; opacity: 0.7; }
            to { box-shadow: 0 0 30px #1769FF, 0 0 60px rgba(23, 105, 255, 0.4); opacity: 1; }
        }

        /* ── Airplane Animation ── */
        .plane-wrapper {
            position: relative;
            height: 60px;
            overflow: hidden;
            margin: 1rem 0;
        }
        .animated-plane {
            position: absolute;
            font-size: 2rem;
            animation: flyAcross 4s linear infinite;
            color: #60a5fa;
        }
        @keyframes flyAcross {
            0% { left: -10%; opacity: 0; transform: translateY(10px) rotate(0deg); }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { left: 110%; opacity: 0; transform: translateY(-10px) rotate(5deg); }
        }

        /* ── Text ── */
        .error-title {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 800;
            color: white;
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
        }
        .error-subtitle {
            font-size: 1.1rem;
            color: #94a3b8;
            max-width: 480px;
            margin: 0 auto 2.5rem;
            line-height: 1.7;
        }

        /* ── Info Cards ── */
        .info-cards {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
        }
        .info-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 16px;
            padding: 1.25rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: 180px;
            transition: all 0.3s ease;
            cursor: default;
        }
        .info-card:hover {
            background: rgba(23, 105, 255, 0.1);
            border-color: rgba(23, 105, 255, 0.3);
            transform: translateY(-3px);
        }
        .info-card i {
            font-size: 1.5rem;
            color: var(--blue);
        }
        .info-card-text { text-align: left; }
        .info-card-label { font-size: 0.7rem; color: #64748b; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .info-card-value { font-size: 0.95rem; color: white; font-weight: 600; }

        /* ── Action Buttons ── */
        .btn-go-home {
            background: linear-gradient(135deg, #1769FF, #60a5fa);
            color: white;
            border: none;
            padding: 0.875rem 2.5rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(23, 105, 255, 0.4);
        }
        .btn-go-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(23, 105, 255, 0.5);
            color: white;
        }
        .btn-go-back {
            background: transparent;
            color: #94a3b8;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 0.875rem 2.5rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }
        .btn-go-back:hover {
            color: white;
            border-color: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        /* ── Quick Links ── */
        .quick-links-title {
            font-size: 0.8rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .quick-links {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .quick-link {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            color: #94a3b8;
            text-decoration: none;
            padding: 0.5rem 1.25rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.25s ease;
        }
        .quick-link:hover {
            background: rgba(23, 105, 255, 0.15);
            border-color: rgba(23, 105, 255, 0.4);
            color: #60a5fa;
        }

        /* ── Footer ── */
        .footer-404 {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 1.5rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            color: #475569;
            font-size: 0.85rem;
        }
        .footer-404 a { color: #3b82f6; text-decoration: none; }
    </style>
</head>
<body>

    <!-- ===== PAGE LOADER ===== -->
    <div id="page-loader">
        <div class="loader-ring-wrap">
            <div class="loader-ripple"></div>
            <div class="loader-ripple"></div>
            <div class="loader-ring"></div>
            <div class="loader-ring-inner"></div>
            <img class="loader-logo" src="assets/images/logo.webp" alt="Stackly">
        </div>
        <div class="loader-brand">STACKLY</div>
        <div class="loader-progress-track">
            <div class="loader-progress-bar"></div>
        </div>
    </div>
    <!-- ===== END LOADER ===== -->


    <!-- Stars -->
    <div class="stars-bg" id="stars"></div>

    <!-- Glowing orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Navbar Removed -->

    <!-- Main Content -->
    <div class="page-center">
        <div class="text-center">

            <!-- Big 404 -->
            <div class="giant-404">404</div>

            <!-- Plane flying across -->
            <div class="plane-wrapper">
                <span class="animated-plane"><i class="bi bi-airplane-fill"></i></span>
            </div>

            <!-- Title & Subtitle -->
            <h1 class="error-title mt-3">Oops! Destination Not Found</h1>
            <p class="error-subtitle">
                Looks like this page took a wrong turn somewhere over the clouds. 
                The page you're looking for may have been moved, deleted, or never existed.
            </p>

            <!-- Info Cards Removed -->

            <!-- Buttons -->
            <div class="d-flex gap-3 justify-content-center flex-wrap">
                <a href="index.html" class="btn-go-home">
                    <i class="bi bi-house-fill"></i> Back to Home
                </a>
                <a href="#" onclick="if(document.referrer) { history.back(); } else { window.location.href='index.html'; }; return false;" class="btn-go-back">
                    <i class="bi bi-arrow-left"></i> Go Back
                </a>
            </div>

            <!-- Quick Links Removed -->

        </div>
    </div>

    <!-- Footer Removed -->

    <script>
        // Generate random twinkling stars
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 120; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2.5 + 0.5;
            star.style.cssText = `
                width: ${size}px;
                height: ${size}px;
                top: ${Math.random() * 100}%;
                left: ${Math.random() * 100}%;
                --d: ${Math.random() * 4 + 2}s;
                --o: ${Math.random() * 0.6 + 0.2};
                animation-delay: ${Math.random() * 5}s;
            `;
            starsContainer.appendChild(star);
        }

        // Show current time
        function updateTime() {
            const now = new Date();
            const t = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
            document.getElementById('current-time').textContent = t;
        }
        updateTime();
        setInterval(updateTime, 1000);

        // Show the bad URL
        document.getElementById('bad-url').textContent = window.location.pathname || '/404';
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/script.js"></script>
    <script src="js/loader.js"></script>
</body>
</html>

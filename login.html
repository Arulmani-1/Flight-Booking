<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Stackly Flight Booking</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- AOS Animation CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .split-layout {
            min-height: 100vh;
            display: flex;
        }
        .split-image {
            flex: 1;
            background-image: url('assets/images/login-bg.webp');
            background-size: cover;
            background-position: center;
            position: relative;
            display: none;
        }
        @media (min-width: 992px) {
            .split-image {
                display: block;
            }
        }
        .split-image::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(2, 6, 23, 0.2), rgba(2, 6, 23, 0.9));
        }
        .split-form {
            flex: 1;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem;
            background-color: var(--white);
            position: relative;
        }
        @media (max-width: 767.98px) {
            .split-form {
                padding: 2rem 1.5rem;
            }
        }
        .auth-brand {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: var(--primary) !important;
            text-decoration: none;
            margin-bottom: 3rem;
            display: inline-block;
        }
        
        .premium-input {
            border: 1px solid #E2E8F0;
            background-color: #F8FAFC !important;
            padding: 14px 20px;
            transition: var(--transition-fast);
        }
        .premium-input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 4px rgba(23, 105, 255, 0.1);
        }
        .input-group-text.premium-input-icon {
            background-color: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-right: none;
            padding-left: 20px;
        }
        .premium-input.with-icon {
            border-left: none;
        }
    </style>
</head>
<body>

    <!-- ===== PAGE LOADER ===== -->
    <div id="page-loader">
        <div class="loader-ring-wrap">
            <div class="loader-ripple"></div>
            <div class="loader-ripple"></div>
            <div class="loader-ring"></div>
            <div class="loader-ring-inner"></div>
            <img class="loader-logo" src="assets/images/logo.webp" alt="Stackly">
        </div>
        <div class="loader-brand">STACKLY</div>
        <div class="loader-progress-track">
            <div class="loader-progress-bar"></div>
        </div>
    </div>
    <!-- ===== END LOADER ===== -->


    <div class="split-layout">
        <!-- Left Image -->
        <div class="split-image">
            <div class="position-absolute bottom-0 start-0 p-5 z-3 text-white">
                <span class="badge bg-white text-dark rounded-pill px-3 py-2 fw-bold mb-4 shadow-sm">Stackly Member</span>
                <h2 class="display-5 fw-bold mb-3 letter-spacing-n1">Your Next Adventure Awaits</h2>
                <p class="lead text-white-75 mb-4" style="max-width: 450px;">Log in to manage your bookings, check flight status, and access exclusive member-only luxury deals.</p>
            </div>
        </div>
        
        <!-- Right Form -->
        <div class="split-form">
            <!-- Back button overlay for UX -->

            
            <a href="index.html" class="auth-brand">
                <img src="assets/images/logo.webp" alt="Stackly Logo" style="height:38px; width:auto; object-fit:contain;">
            </a>
            
            <h2 class="fw-bold mb-2 auth-title letter-spacing-n1">Welcome Back</h2>
            <p class="text-muted mb-5 auth-subtitle">Please enter your details to sign in.</p>
            
            <form class="auth-form needs-validation" novalidate>
                <div class="mb-4">
                    <label class="form-label fw-bold text-muted small text-uppercase letter-spacing-1">Role</label>
                    <div class="input-group">
                        <span class="input-group-text premium-input-icon"><i class="bi bi-person-badge text-muted"></i></span>
                        <select class="form-select premium-input with-icon text-muted" required>
                            <option value="" selected disabled>Select your role</option>
                            <option value="client">Client</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold text-muted small text-uppercase letter-spacing-1">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text premium-input-icon"><i class="bi bi-envelope text-muted"></i></span>
                        <input type="email" class="form-control premium-input with-icon" placeholder="Enter your email" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold text-muted small text-uppercase letter-spacing-1">Password</label>
                    <div class="input-group">
                        <span class="input-group-text premium-input-icon"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" class="form-control premium-input with-icon" placeholder="••••••••" minlength="8" required>
                    </div>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-5">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember">
                        <label class="form-check-label text-muted fw-medium" for="remember">Remember for 30 days</label>
                    </div>
                    <a href="#" class="text-primary fw-bold text-decoration-none hover-border-primary pb-1 border-bottom border-2 border-transparent transition-fast">Forgot password?</a>
                </div>
                
                <button type="submit" class="btn btn-premium w-100 py-3 mb-4 justify-content-center fs-6">Sign In <i class="bi bi-arrow-right ms-2"></i></button>
                
                <div class="text-center mb-4 position-relative">
                    <hr class="text-muted opacity-25">
                    <span class="text-muted fw-medium small px-3 bg-white position-absolute top-50 start-50 translate-middle">Or continue with</span>
                </div>
                
                <div class="d-flex gap-3 mb-5">
                    <button type="button" class="btn btn-outline-secondary w-50 py-2 d-flex align-items-center justify-content-center gap-2 fw-bold text-dark border-light shadow-sm hover-lift">
                        <i class="bi bi-google text-danger fs-5"></i> Google
                    </button>
                    <button type="button" class="btn btn-outline-secondary w-50 py-2 d-flex align-items-center justify-content-center gap-2 fw-bold text-dark border-light shadow-sm hover-lift">
                        <i class="bi bi-apple text-dark fs-5"></i> Apple
                    </button>
                </div>
                
                <p class="text-center text-muted fw-medium mb-4">
                    Don't have an account? <a href="signup.html" class="text-primary fw-bold text-decoration-none ms-1">Sign Up</a>
                </p>
                
                <div class="text-center mt-3">
                    <a href="index.html" class="btn btn-outline-secondary rounded-pill px-4 py-2 fw-bold shadow-sm hover-lift"><i class="bi bi-house-door me-2"></i>Go To Home</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tl = gsap.timeline();
            tl.from('.auth-brand', { y: 20, opacity: 0, duration: 0.6, ease: 'power3.out' })
              .from('.auth-title', { y: 20, opacity: 0, duration: 0.6, ease: 'power3.out' }, '-=0.4')
              .from('.auth-subtitle', { y: 20, opacity: 0, duration: 0.6, ease: 'power3.out' }, '-=0.4')
              .from('.auth-form', { y: 20, opacity: 0, duration: 0.8, ease: 'power3.out' }, '-=0.4');
              
            // Form Validation
            const form = document.querySelector('.needs-validation');
            const roleSelect = document.querySelector('.form-select');
            
            form.addEventListener('submit', (e) => {
                e.preventDefault(); // Prevent default form submission
                
                if (!form.checkValidity()) {
                    e.stopPropagation();
                    form.classList.add('was-validated');
                } else {
                    // Valid form, redirect based on selected role
                    const role = roleSelect.value;
                    if (role === 'admin') {
                        window.location.href = 'admin-dashboard.html';
                    } else if (role === 'client') {
                        window.location.href = 'client-dashboard.html';
                    }
                }
            });
        });
    </script>
    <script src="js/loader.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Stackly Flight Booking</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- AOS Animation CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .split-layout {
            min-height: 100vh;
            display: flex;
        }
        .split-image {
            flex: 1;
            background-image: url('assets/images/signup-bg.webp');
            background-size: cover;
            background-position: center;
            position: relative;
            display: none;
        }
        @media (min-width: 992px) {
            .split-image {
                display: block;
            }
        }
        .split-image::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(2, 6, 23, 0.2), rgba(2, 6, 23, 0.9));
        }
        .split-form {
            flex: 1;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem;
            background-color: var(--white);
            overflow-y: auto;
            position: relative;
        }
        @media (max-width: 767.98px) {
            .split-form {
                padding: 2rem 1.5rem;
            }
        }
        .auth-brand {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: var(--primary) !important;
            text-decoration: none;
            margin-bottom: 2rem;
            display: inline-block;
        }
        
        .premium-input {
            border: 1px solid #E2E8F0;
            background-color: #F8FAFC !important;
            padding: 14px 20px;
            transition: var(--transition-fast);
        }
        .premium-input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 4px rgba(23, 105, 255, 0.1);
        }

        .password-strength {
            height: 4px;
            width: 100%;
            background-color: #E2E8F0;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.4s ease, background-color 0.4s ease;
        }
    </style>
</head>
<body>

    <!-- ===== PAGE LOADER ===== -->
    <div id="page-loader">
        <div class="loader-ring-wrap">
            <div class="loader-ripple"></div>
            <div class="loader-ripple"></div>
            <div class="loader-ring"></div>
            <div class="loader-ring-inner"></div>
            <img class="loader-logo" src="assets/images/logo.webp" alt="Stackly">
        </div>
        <div class="loader-brand">STACKLY</div>
        <div class="loader-progress-track">
            <div class="loader-progress-bar"></div>
        </div>
    </div>
    <!-- ===== END LOADER ===== -->


    <div class="split-layout">
        <!-- Right Form (Sign up kept consistent) -->
        <div class="split-form order-2 order-lg-1">

            
            <a href="index.html" class="auth-brand">
                <img src="assets/images/logo.webp" alt="Stackly Logo" style="height:38px; width:auto; object-fit:contain;">
            </a>
            
            <h2 class="fw-bold mb-2 auth-title letter-spacing-n1">Create an Account</h2>
            <p class="text-muted mb-4 auth-subtitle">Join Stackly to unlock premium features and deals.</p>
            
            <form class="auth-form needs-validation" novalidate>
                <div class="row g-3">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold text-muted small text-uppercase letter-spacing-1">First Name</label>
                        <input type="text" class="form-control premium-input" placeholder="John" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold text-muted small text-uppercase letter-spacing-1">Last Name</label>
                        <input type="text" class="form-control premium-input" placeholder="Doe" required>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold text-muted small text-uppercase letter-spacing-1">Email Address</label>
                    <input type="email" class="form-control premium-input" placeholder="john@example.com" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold text-muted small text-uppercase letter-spacing-1">Role</label>
                    <select class="form-select premium-input text-muted" required>
                        <option value="" selected disabled>Select your role</option>
                        <option value="client">Client</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                
                <div class="mb-3 position-relative">
                    <label class="form-label fw-bold text-muted small text-uppercase letter-spacing-1">Password</label>
                    <div class="position-relative">
                        <input type="password" class="form-control premium-input pe-5" id="password" placeholder="Create a strong password" minlength="8" required>
                        <i class="bi bi-eye-slash text-muted position-absolute top-50 end-0 translate-middle-y me-3" style="cursor: pointer;" id="togglePassword"></i>
                    </div>
                    <div class="password-strength">
                        <div class="password-strength-bar" id="strengthBar"></div>
                    </div>
                    <small class="text-muted fw-medium mt-1 d-block" id="strengthText">Use at least 8 characters</small>
                </div>
                
                <div class="mb-3 position-relative">
                    <label class="form-label fw-bold text-muted small text-uppercase letter-spacing-1">Confirm Password</label>
                    <div class="position-relative">
                        <input type="password" class="form-control premium-input pe-5" id="confirmPassword" placeholder="Confirm your password" minlength="8" required>
                        <i class="bi bi-eye-slash text-muted position-absolute top-50 end-0 translate-middle-y me-3" style="cursor: pointer;" id="toggleConfirmPassword"></i>
                    </div>
                </div>
                
                <div class="form-check mb-4 mt-4">
                    <input class="form-check-input mt-1" type="checkbox" id="terms" required>
                    <label class="form-check-label text-muted fw-medium small lh-sm" for="terms">
                        By creating an account, I agree to Stackly's <a href="#" class="text-primary fw-bold text-decoration-none">Terms & Conditions</a> and <a href="#" class="text-primary fw-bold text-decoration-none">Privacy Policy</a>.
                    </label>
                </div>
                
                <button type="submit" class="btn btn-premium w-100 py-3 mb-4 justify-content-center fs-6">Create Account <i class="bi bi-arrow-right ms-2"></i></button>
                
                <div class="text-center mb-4 position-relative">
                    <hr class="text-muted opacity-25">
                    <span class="text-muted fw-medium small px-3 bg-white position-absolute top-50 start-50 translate-middle">Or continue with</span>
                </div>
                
                <div class="d-flex gap-3 mb-5">
                    <button type="button" class="btn btn-outline-secondary w-50 py-2 d-flex align-items-center justify-content-center gap-2 fw-bold text-dark border-light shadow-sm hover-lift">
                        <i class="bi bi-google text-danger fs-5"></i> Google
                    </button>
                    <button type="button" class="btn btn-outline-secondary w-50 py-2 d-flex align-items-center justify-content-center gap-2 fw-bold text-dark border-light shadow-sm hover-lift">
                        <i class="bi bi-apple text-dark fs-5"></i> Apple
                    </button>
                </div>
                
                <p class="text-center text-muted fw-medium mb-4">
                    Already have an account? <a href="login.html" class="text-primary fw-bold text-decoration-none ms-1">Log In</a>
                </p>
                
                <div class="text-center mt-3">
                    <a href="index.html" class="btn btn-outline-secondary rounded-pill px-4 py-2 fw-bold shadow-sm hover-lift"><i class="bi bi-house-door me-2"></i>Go To Home</a>
                </div>
            </form>
        </div>
        
        <!-- Left Image -->
        <div class="split-image order-1 order-lg-2">
            <div class="position-absolute bottom-0 start-0 p-5 z-3 text-white">
                <span class="badge bg-gold text-dark rounded-pill px-3 py-2 fw-bold mb-4 shadow-sm">Join the Club</span>
                <h2 class="display-5 fw-bold mb-3 letter-spacing-n1">Join the Elite Travelers</h2>
                <p class="lead text-white-75 mb-4" style="max-width: 450px;">Experience seamless booking, curated packages, and 24/7 premium support worldwide.</p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tl = gsap.timeline();
            tl.from('.auth-brand', { y: 20, opacity: 0, duration: 0.6, ease: 'power3.out' })
              .from('.auth-title', { y: 20, opacity: 0, duration: 0.6, ease: 'power3.out' }, '-=0.4')
              .from('.auth-subtitle', { y: 20, opacity: 0, duration: 0.6, ease: 'power3.out' }, '-=0.4')
              .from('.auth-form', { y: 20, opacity: 0, duration: 0.8, ease: 'power3.out' }, '-=0.4');
              
            // Password Strength Indicator
            const password = document.getElementById('password');
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');
            const togglePassword = document.getElementById('togglePassword');
            const confirmPassword = document.getElementById('confirmPassword');
            const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
            
            togglePassword.addEventListener('click', function() {
                const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                password.setAttribute('type', type);
                this.classList.toggle('bi-eye');
                this.classList.toggle('bi-eye-slash');
            });
            
            toggleConfirmPassword.addEventListener('click', function() {
                const type = confirmPassword.getAttribute('type') === 'password' ? 'text' : 'password';
                confirmPassword.setAttribute('type', type);
                this.classList.toggle('bi-eye');
                this.classList.toggle('bi-eye-slash');
            });

            password.addEventListener('input', () => {
                const val = password.value;
                let strength = 0;
                
                if (val.length === 0) {
                    strength = 0;
                } else if (val.length >= 8) {
                    strength = 100; // Strong
                } else if (val.length >= 5) {
                    strength = 60; // Fair
                } else {
                    strength = 30; // Weak
                }
                
                strengthBar.style.width = strength + '%';
                
                if (strength === 0) {
                    strengthBar.style.backgroundColor = 'transparent';
                    strengthText.innerText = 'Use at least 8 characters';
                    strengthText.className = 'text-muted fw-medium mt-1 d-block';
                } else if (strength <= 40) {
                    strengthBar.style.backgroundColor = '#ef4444'; // red
                    strengthText.innerText = 'Weak';
                    strengthText.className = 'text-danger fw-bold mt-1 d-block';
                } else if (strength <= 80) {
                    strengthBar.style.backgroundColor = '#f59e0b'; // orange
                    strengthText.innerText = 'Fair';
                    strengthText.className = 'text-warning fw-bold mt-1 d-block';
                } else {
                    strengthBar.style.backgroundColor = '#10b981'; // green
                    strengthText.innerText = 'Strong';
                    strengthText.className = 'text-success fw-bold mt-1 d-block';
                }
            });
            
            // Form Validation
            const form = document.querySelector('.needs-validation');
            form.addEventListener('submit', (e) => {
                // Custom validation for confirm password
                if (password.value !== confirmPassword.value) {
                    confirmPassword.setCustomValidity("Passwords do not match");
                } else {
                    confirmPassword.setCustomValidity("");
                }
                
                if (!form.checkValidity()) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                form.classList.add('was-validated');
            });
        });
    </script>
    <script src="js/loader.js"></script>
</body>
</html>
